name: TK build (Windows)

# This fork keeps `main` identical to storytold/cadcraft (so "Sync fork" never conflicts) and
# keeps TK's changes on the `tk` branch. This workflow lives on `tk` and the branches made
# from it:
#   - push to `tk`           -> release "tk-<n>", and the fixed "latest" release is replaced
#                               with it; only the 5 newest tk-<n> are kept; all pre-releases
#                               are removed (their work is now in tk)
#   - push to another branch -> pre-release "tk-<n>-<branch>" to try a change first (only the
#                               newest one per branch is kept)
# Download: Releases > latest > cadcraft-tk-windows-x64.zip, unzip, run cadcraft.exe.
# Unsigned: on first launch Windows may warn ("More info" > "Run anyway").

on:
  push:
    branches-ignore: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tk-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.ref_name != 'main'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p cadcraft -p cadcraft-cli

      - name: Package
        shell: pwsh
        run: |
          $dir = "cadcraft-tk"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/cadcraft.exe, target/release/cadcraft-cli.exe $dir
          Copy-Item LICENSE-MIT, LICENSE-APACHE, NOTICE $dir
          "Built from ${{ github.ref_name }} @ ${{ github.sha }} (run ${{ github.run_number }})" | Out-File "$dir/BUILD.txt"
          Compress-Archive -Path "$dir/*" -DestinationPath cadcraft-tk-windows-x64.zip

      - name: Publish and tidy releases
        shell: bash
        run: |
          set -euo pipefail
          n="${GITHUB_RUN_NUMBER}"
          zip="cadcraft-tk-windows-x64.zip"
          notes="CADCraft (fork ของ TK) สำหรับ Windows 64 บิต — branch ${GITHUB_REF_NAME}, build ${n}

          วิธีใช้: ดาวน์โหลด ${zip} แตกไฟล์ไว้ในโฟลเดอร์ เช่น C:\\CADCraft-TK\\ (แตกทับของเดิมได้) แล้วเปิด cadcraft.exe
          ครั้งแรก Windows อาจเตือน: กด More info แล้วกด Run anyway"

          if [ "${GITHUB_REF_NAME}" = "tk" ]; then
            gh release create "tk-${n}" "$zip" --target "$GITHUB_SHA" --title "CADCraft TK build ${n}" --notes "$notes"
            # The fixed "latest" link: replaced by this build.
            gh release delete latest --cleanup-tag --yes 2>/dev/null || true
            gh release create latest "$zip" --target "$GITHUB_SHA" --title "CADCraft TK — ล่าสุด (build ${n})" --notes "$notes" --latest
            # Keep the 5 newest tk-<n> builds.
            gh release list --limit 200 --json tagName --jq '.[].tagName' \
              | { grep -E '^tk-[0-9]+$' || true; } | sort -t- -k2 -n -r | tail -n +6 \
              | while read -r t; do gh release delete "$t" --cleanup-tag --yes; done
            # Pre-releases of branches merged into tk are no longer needed.
            gh release list --limit 200 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' \
              | while read -r t; do gh release delete "$t" --cleanup-tag --yes; done
          else
            safe=$(printf '%s' "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9._-' '-')
            # Only the newest pre-release per branch.
            gh release list --limit 200 --json tagName --jq '.[].tagName' \
              | { grep -E "^tk-[0-9]+-${safe}\$" || true; } \
              | while read -r t; do gh release delete "$t" --cleanup-tag --yes; done
            gh release create "tk-${n}-${safe}" "$zip" --target "$GITHUB_SHA" --prerelease \
              --title "ทดลอง: ${GITHUB_REF_NAME} (build ${n})" --notes "$notes"
          fi
