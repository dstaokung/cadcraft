name: TK build (Windows)

# Builds this fork's CADCraft for Windows x64 and publishes it as a GitHub Release:
#   - a push to `main`          -> a release "tk-<n>" (the version to use)
#   - a push to any other branch -> a pre-release "tk-<n>-<branch>" (to try a change first)
#   - Actions > TK build (Windows) > Run workflow: the same, for the chosen branch
# Download: Releases > newest > cadcraft-tk-windows-x64.zip, unzip, run cadcraft.exe.
# Unsigned: on first launch Windows may warn ("More info" > "Run anyway").

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tk-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p cadcraft -p cadcraft-cli

      - name: Package
        shell: pwsh
        run: |
          $dir = "cadcraft-tk"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/cadcraft.exe, target/release/cadcraft-cli.exe $dir
          Copy-Item LICENSE-MIT, LICENSE-APACHE, NOTICE $dir
          "Built from ${{ github.ref_name }} @ ${{ github.sha }}" | Out-File "$dir/BUILD.txt"
          Compress-Archive -Path "$dir/*" -DestinationPath cadcraft-tk-windows-x64.zip

      - name: Release name
        id: tag
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tag=tk-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "pre=false" >> "$GITHUB_OUTPUT"
          else
            safe=$(echo "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9._-' '-')
            echo "tag=tk-${GITHUB_RUN_NUMBER}-${safe}" >> "$GITHUB_OUTPUT"
            echo "pre=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: CADCraft TK ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.tag.outputs.pre == 'true' }}
          body: |
            CADCraft (fork ของ TK) สำหรับ Windows 64 บิต
            branch: ${{ github.ref_name }}

            วิธีใช้: ดาวน์โหลด cadcraft-tk-windows-x64.zip แตกไฟล์ไว้ในโฟลเดอร์ เช่น C:\CADCraft-TK\ แล้วเปิด cadcraft.exe
            ครั้งแรก Windows อาจเตือน: กด More info แล้วกด Run anyway
          files: cadcraft-tk-windows-x64.zip
